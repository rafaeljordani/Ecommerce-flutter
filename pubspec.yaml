name: ecommerce
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  animated_snack_bar: ^0.4.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  provider: ^6.1.5+1

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_screen.png"
  color_dark: "#FFFFFF"
  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_screen.png
    icon_background_color: "#111111"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
